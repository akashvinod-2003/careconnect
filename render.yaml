web:
  plan: free
  numInstances: 1
  services:
    - type: web
      name: careconnect
      runtime: python
      buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
      startCommand: "gunicorn careconnect.wsgi"
      envVars:
        - key: PYTHON_VERSION
          value: "3.10"
        - key: DEBUG
          value: "False"
        - key: ALLOWED_HOSTS
          value: ".onrender.com"

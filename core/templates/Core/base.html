<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect</title>
    <!-- Import Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-teal-700 flex items-center gap-2">
                ❤️ CareConnect
            </a>
            
            <div>
                {% if user.is_authenticated %}
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-semibold bg-gray-100 px-3 py-1 rounded-full text-gray-600">
                            {{ user.username }} ({{ user.role|title }})
                        </span>
                        <form action="{% url 'logout' %}" method="post" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-red-500 font-bold hover:text-red-700 text-sm">Logout</button>
                        </form>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="text-teal-700 font-bold hover:underline">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-4 mt-4">
        {% block content %}
        <!-- Child pages will inject their content here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-white text-center py-6 mt-auto">
        <p>&copy; 2025 CareConnect Enterprise. All rights reserved.</p>
    </footer>

</body>
</html>

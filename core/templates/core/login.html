{% extends 'core/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-3xl font-bold text-gray-800 mb-2 text-center">Welcome Back</h2>
        <p class="text-gray-500 text-center mb-8">Please sign in to continue</p>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Username</label>
                <input type="text" name="username" required class="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 focus:border-teal-500 focus:ring-0 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                <input type="password" name="password" required class="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 focus:border-teal-500 focus:ring-0 outline-none transition">
            </div>

            <button type="submit" class="w-full bg-teal-700 text-white py-4 rounded-xl font-bold text-lg hover:bg-teal-800 shadow-lg transition transform hover:scale-[1.02]">
                Sign In
            </button>
        </form>
        
        <p class="text-center mt-6 text-gray-600">
            Don't have an account? <a href="{% url 'signup' %}" class="text-teal-700 hover:underline font-bold">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
